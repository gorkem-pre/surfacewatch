[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "surfacewatch"
version = "0.1.0"
description = "Kapsam kontrollü saldırı yüzeyi tarama (red) ve değişiklik izleme (blue) aracı"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "gorkem-pre" }]
keywords = ["security", "attack-surface", "recon", "nmap", "blue-team", "red-team", "mitre-attack"]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
surfacewatch = "surfacewatch.cli:main"

[tool.setuptools.packages.find]
include = ["surfacewatch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "E702"]
